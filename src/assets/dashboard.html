<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure JavaScript Excel</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="db">

            <div class="db__header">
                <h1>Excel Dashboard</h1>
            </div>

            <div class="db__new">
                <div class="db__view">
                    <a href="#" class="db__create">New</a>
                </div>
            </div>

            <div class="db__table db__view">
                <div class="db__list-header">
                    <span>Назва</span>
                    <span>Останній змінений</span>
                </div>

                <ul class="db__list">
                    <li class="db__record">
                        <a href="#">Таблиця 1</a>
                        <strong>12.02.2026</strong>
                    </li>
                    <li class="db__record">
                        <a href="#">Таблиця 2</a>
                        <strong>12.02.2026</strong>
                    </li>
                    <li class="db__record">
                        <a href="#">Таблиця 3</a>
                        <strong>12.02.2026</strong>
                    </li>
                </ul>

            </div>
        </div>
    </div>
</body>

</html>
